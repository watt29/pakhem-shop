<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบพิมพ์สติกเกอร์ฉลากหน้าถุง — ปลาสลิดแดดเดียว ป้าเข็ม คัดพิเศษ</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding: 24px; }

    .toolbar {
      max-width: 900px;
      margin: 0 auto 22px auto;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 16px;
      padding: 18px 22px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .toolbar h1 { font-size: 1.15rem; font-weight: 800; color: #9a3412; }
    .toolbar p { font-size: 0.82rem; color: #475569; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; width: 100%; margin-top: 8px; padding-top: 12px; border-top: 1px dashed #e2e8f0; }
    .control-item { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; font-weight: 600; color: #334155; }
    .control-item select, .control-item input {
      padding: 7px 11px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.85rem;
      background: #fff;
    }
    .btn-print {
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
      margin-left: auto;
    }
    .btn-print:hover { opacity: 0.95; }

    /* A4 Sheet Layout */
    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #ffffff;
      padding: 10mm;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6mm;
      align-content: start;
    }

    /* Individual Sticker Label Card */
    .label-card {
      border: 2px solid #b45309;
      border-radius: 12px;
      overflow: hidden;
      background: #fffbeb;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      page-break-inside: avoid;
    }
    .label-header {
      background: linear-gradient(135deg, #9a3412 0%, #d97706 100%);
      color: #ffffff;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f59e0b;
    }
    .brand-title { font-size: 1.05rem; font-weight: 800; line-height: 1.15; letter-spacing: 0.2px; }
    .brand-sub { font-size: 0.68rem; color: #fef3c7; font-weight: 500; margin-top: 2px; }
    .size-badge {
      background: #fef3c7;
      color: #92400e;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 99px;
      text-align: center;
      border: 1px solid #f59e0b;
      white-space: nowrap;
    }

    .label-body {
      padding: 8px 11px;
      font-size: 0.67rem;
      line-height: 1.42;
      color: #1e293b;
      background: #ffffff;
      flex: 1;
    }
    .slogan-bar {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      font-weight: 700;
      font-size: 0.68rem;
      text-align: center;
      padding: 3px 6px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .ing-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 5px;
      font-size: 0.65rem;
    }
    .ing-table td {
      padding: 2px 4px;
      border-bottom: 1px dashed #e2e8f0;
    }
    .ing-table td:last-child {
      text-align: right;
      font-weight: 700;
      color: #9a3412;
    }
    .info-list {
      font-size: 0.63rem;
      color: #334155;
      line-height: 1.38;
      margin-bottom: 6px;
    }
    .info-list b { color: #0f172a; }

    .meta-row {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 8px;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 8px;
    }
    .meta-fields {
      font-size: 0.65rem;
      line-height: 1.5;
      color: #0f172a;
    }
    .weight-highlight {
      font-size: 0.78rem;
      font-weight: 800;
      color: #b91c1c;
      background: #fee2e2;
      padding: 1px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 2px;
    }
    .qr-box {
      text-align: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 3px;
    }
    .qr-box img { width: 56px; height: 56px; display: block; margin: 0 auto; }
    .qr-box span { display: block; font-size: 0.52rem; font-weight: 700; color: #059669; margin-top: 1px; line-height: 1.1; }

    .label-footer {
      background: #0f172a;
      color: #f8fafc;
      padding: 4px 10px;
      font-size: 0.58rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Official Branded Artwork Sticker Card */
    .art-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 4px;
      page-break-inside: avoid;
      overflow: hidden;
    }
    .art-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .back-meta-overlay {
      position: absolute;
      bottom: 9.8%;
      font-size: 0.72rem;
      font-weight: 800;
      color: #7c2d12;
      line-height: 1.15;
      text-align: center;
      pointer-events: none;
    }
    .back-meta-weight { left: 8.5%; width: 20%; }
    .back-meta-mfg { left: 29.8%; width: 17.5%; }
    .back-meta-bbf { left: 48.2%; width: 18%; }

    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none !important; }
      .sheet { box-shadow: none; width: 100%; padding: 6mm; margin: 0; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div>
      <h1>🏷️ ระบบพิมพ์สติกเกอร์ฉลากแปะถุงซีลสูญญากาศ — ปลาสลิดแดดเดียว ป้าเข็ม</h1>
      <p>รองรับทั้งสติกเกอร์โลโก้ไดคัทหน้าถุง + ฉลากรายละเอียดหลังถุง (พิมพ์น้ำหนักสุทธิ วันผลิต และวันหมดอายุให้อัตโนมัติ)</p>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ สั่งพิมพ์สติกเกอร์ / บันทึก PDF</button>

    <div class="controls">
      <div class="control-item">
        <label>รูปแบบที่ต้องการพิมพ์:</label>
        <select id="styleSelect" onchange="renderStickers()">
          <option value="box_insert" selected>📦 ใบแนบในกล่องพัสดุ (พิมพ์กระดาษ A4 ธรรมดา ตัดใส่ในกล่อง — ไม่ต้องใช้สติกเกอร์)</option>
          <option value="artwork_pair">🌟 ชุดคู่หน้า-หลังถุง (โลโก้หน้าถุง + ฉลากหลังถุงพร้อมวันที่)</option>
          <option value="artwork_front">🐟 เฉพาะโลโก้แปะหน้าถุงซีล (สติกเกอร์ไดคัทป้าเข็ม)</option>
          <option value="artwork_back">📋 เฉพาะฉลากหลังถุงซีล (รายละเอียด + น้ำหนัก & วันที่อัตโนมัติ)</option>
          <option value="classic">📄 แบบตารางมาตรฐาน (Classic Clean Label)</option>
        </select>
      </div>
      <div class="control-item">
        <label>ขนาดน้ำหนักสุทธิบนฉลาก:</label>
        <select id="weightSelect" onchange="renderStickers()">
          <option value="900-1,000 กรัม (5-7 ตัว)" selected>ชุดขายดี 900 - 1,000 กรัม (ประมาณ 5-7 ตัว)</option>
          <option value="450-500 กรัม (3-4 ตัว)">ชุดพอดีมื้อ 450 - 500 กรัม (ประมาณ 3-4 ตัว)</option>
          <option value="" >เว้นว่างไว้เขียนเองหน้างาน</option>
        </select>
      </div>
      <div class="control-item">
        <label>วันที่ผลิต (MFG):</label>
        <input type="text" id="mfgInput" onchange="renderStickers()">
      </div>
      <div class="control-item">
        <label>ควรบริโภคก่อน (BBF ช่องฟรีซ -18°C):</label>
        <input type="text" id="bbfInput" onchange="renderStickers()">
      </div>
      <div class="control-item">
        <label>จำนวนดวงต่อแผ่น A4:</label>
        <select id="countSelect" onchange="renderStickers()">
          <option value="4" selected>4 ใบ / แผ่น A4 (ขนาดกำลังดี อ่านง่ายสำหรับผู้ใหญ่)</option>
          <option value="6">6 ใบ / แผ่น A4 (ประหยัดกระดาษ)</option>
          <option value="2">2 ใบ / แผ่น A4 (ครึ่งแผ่น A5 ใบใหญ่พิเศษ)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="sheet" id="stickerSheet"></div>

  <script>
    function fmtThaiDate(d) {
      const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
    }

    function initDates() {
      const now = new Date();
      const bbf = new Date();
      bbf.setMonth(bbf.getMonth() + 6);
      document.getElementById('mfgInput').value = fmtThaiDate(now);
      document.getElementById('bbfInput').value = fmtThaiDate(bbf);
      renderStickers();
    }

    function buildFrontArtCard() {
      return `
        <div class="art-card">
          <img src="pakhem_logo_transparent.png?v=20261029" alt="โลโก้หน้าถุงซีล ปลาสลิดป้าเข็ม">
        </div>
      `;
    }

    function buildBackArtCard(weightText, mfgText, bbfText) {
      return `
        <div class="art-card">
          <img src="pakhem_sticker_back.png?v=20261029" alt="ฉลากหลังถุงซีล ปลาสลิดป้าเข็ม">
          <div class="back-meta-overlay back-meta-weight">${weightText}</div>
          <div class="back-meta-overlay back-meta-mfg">${mfgText}</div>
          <div class="back-meta-overlay back-meta-bbf">${bbfText}</div>
        </div>
      `;
    }

    function buildBoxInsertCard(weightText, mfgText, bbfText, qrUrl) {
      return `
        <div class="label-card" style="border: 1.5px dashed #334155; background: #ffffff; border-radius: 10px;">
          <div style="background: #f8fafc; color: #0f172a; padding: 8px 12px; border-bottom: 1.5px solid #cbd5e1; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-size: 1rem; font-weight: 800; color: #9a3412;">🐟 ปลาสลิดแดดเดียวสุพรรณแท้ "ป้าเข็ม คัดพิเศษ"</div>
              <div style="font-size: 0.68rem; color: #475569; font-weight: 600;">ไซส์จัมโบ้ 5–7 ตัว/กก. • เนื้อแน่นหนาฟู มันแทรก เค็มน้อยกลมกล่อม</div>
            </div>
            <div style="font-size:0.65rem; font-weight:700; border:1px solid #9a3412; color:#9a3412; padding:2px 7px; border-radius:6px; text-align:center;">✂️ ใบแนบในกล่อง<br>ปลอดสาร 100%</div>
          </div>

          <div class="label-body" style="padding: 9px 12px; font-size: 0.68rem; line-height: 1.48;">
            <div style="margin-bottom: 6px; color: #0f172a;">
              <b>🙏 ขอบพระคุณที่อุดหนุนปลาสลิดป้าเข็มนะคะ</b><br>
              ป้าเข็มตั้งใจคัดปลาสลิดสุพรรณแท้ตัวใหญ่ สด สะอาด ตากแดดธรรมชาติ และซีลสูญญากาศแช่แข็งส่งตรงถึงมือคุณลูกค้าค่ะ
            </div>

            <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:6px 8px; margin-bottom:6px;">
              <div><b>❄️ 1. เมื่อได้รับสินค้าแล้ว (วิธีเก็บรักษา):</b></div>
              <div>• เนื่องจากสินค้าแพ็กแช่แข็งมาในซองฟอยล์เก็บอุณหภูมิ <b>เมื่อแกะกล่องแล้ว แนะนำให้นำถุงปลาเข้าช่องฟรีซ (ช่องแช่แข็ง) ทันที</b></div>
              <div>• <b>ช่องฟรีซ (≤ -18°C):</b> เก็บได้นาน <b>6–12 เดือน</b> | <b>ช่องเย็นธรรมดา:</b> เก็บได้ <b>7–10 วัน</b></div>
            </div>

            <div style="background:#fffbeb; border:1px solid #fde68a; border-radius:6px; padding:6px 8px; margin-bottom:6px;">
              <div><b>🍳 2. เคล็ดลับการทอดให้หนังกรอบ เนื้อนุ่มฟู ไม่ติดกระทะ:</b></div>
              <div>• นำปลาออกจากช่องฟรีซ พักไว้ให้คลายความเย็น (ไม่ต้องล้างน้ำซ้ำ) และซับผิวปลาให้แห้ง</div>
              <div>• ตั้งกระทะใส่น้ำมันให้ร้อน แล้วลดเป็น <b>"ไฟกลางค่อนอ่อน"</b> ทอดจนเหลืองทองกรอบนอกนุ่มใน</div>
            </div>

            <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:6px; padding:5px 8px; margin-bottom:6px; font-size:0.64rem; color:#1e3a8a;">
              <b>🏦 บัญชีสำหรับโอนชำระเงิน (กรณีเก็บเงินปลายทาง / สั่งซื้อรอบถัดไป):</b><br>
              • <b>ธนาคารกรุงไทย (สาขาท่าพระ)</b> | เลขที่บัญชี: <b style="font-size:0.72rem; color:#b91c1c;">038-0-25363-1</b> | ชื่อบัญชี: <b>นายจีรวัฒน์ พลอาจ</b>
            </div>

            <div style="font-size:0.62rem; color:#334155; margin-bottom:5px;">
              <b>🛡️ ส่วนประกอบและมาตรฐาน:</b> เนื้อปลาสลิดสุพรรณแท้ 97% + เกลือสมุทรธรรมชาติ 3% (ไร้สารกันบูด 0% • ไร้ฟอร์มาลีน 0% • ไร้ผงชูรส 0%) | <i>ข้อมูลผู้แพ้อาหาร: มีปลา</i>
            </div>

            <div class="meta-row">
              <div class="meta-fields">
                <div class="weight-highlight" style="background:#fef3c7; color:#92400e; border:1px solid #f59e0b;">ขนาดบรรจุ: ${weightText || '________________'}</div>
                <div><b>วันที่ผลิต (MFG):</b> ${mfgText}</div>
                <div><b>ควรบริโภคก่อน (BBF):</b> ${bbfText}</div>
                <div style="font-size:0.6rem; color:#047857; font-weight:700;">💯 รับประกันความสด: หากถุงซีลรั่ว/เสียหาย ทักแชทเคลมชุดใหม่ฟรี 100%</div>
              </div>
              <div class="qr-box">
                <img src="${qrUrl}" alt="QR สั่งซื้อปลาสลิดป้าเข็ม">
                <span>สแกนสั่งเพิ่ม<br>LINE: @137gsref</span>
              </div>
            </div>
          </div>

          <div class="label-footer" style="background:#1e293b;">
            <span>💬 ทักแชทเพจ: ป้าเข็ม ขายของ | LINE: @137gsref</span>
            <span>📍 ต.เสาธง อ.บางปะหัน จ.พระนครศรีอยุธยา</span>
          </div>
        </div>
      `;
    }

    function renderStickers() {
      const styleMode = document.getElementById('styleSelect').value;
      const weightText = document.getElementById('weightSelect').value;
      const mfgText = document.getElementById('mfgInput').value;
      const bbfText = document.getElementById('bbfInput').value;
      const count = parseInt(document.getElementById('countSelect').value, 10) || 4;
      const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=2&data=' + encodeURIComponent('https://watt29.github.io/pakhem-shop/fish.html');

      const sheetEl = document.getElementById('stickerSheet');
      if (sheetEl) {
        sheetEl.style.gridTemplateColumns = (count === 2) ? '1fr' : '1fr 1fr';
      }

      let html = '';
      for (let i = 0; i < count; i++) {
        if (styleMode === 'box_insert') {
          html += buildBoxInsertCard(weightText, mfgText, bbfText, qrUrl);
          continue;
        }
        if (styleMode === 'artwork_pair') {
          html += (i % 2 === 0) ? buildFrontArtCard() : buildBackArtCard(weightText, mfgText, bbfText);
          continue;
        }
        if (styleMode === 'artwork_front') {
          html += buildFrontArtCard();
          continue;
        }
        if (styleMode === 'artwork_back') {
          html += buildBackArtCard(weightText, mfgText, bbfText);
          continue;
        }
        html += `
          <div class="label-card">
            <div class="label-header">
              <div>
                <div class="brand-title">ปลาสลิดแดดเดียว ป้าเข็ม</div>
                <div class="brand-sub">Dried Gourami Fish • สุพรรณบุรีแท้ คัดพิเศษ</div>
              </div>
              <div class="size-badge">ไซส์จัมโบ้<br>5-7 ตัว/กก.</div>
            </div>

            <div class="label-body">
              <div class="slogan-bar">✨ คัดสรรคุณภาพ สะอาด ปลอดภัย เนื้อล้วนหนาฟู เค็มน้อยกลมกล่อม ✨</div>

              <table class="ing-table">
                <tr>
                  <td><b>ส่วนประกอบสำคัญ:</b> เนื้อปลาสลิดแดดเดียวสุพรรณบุรีแท้</td>
                  <td>97%</td>
                </tr>
                <tr>
                  <td>เกลือสมุทรธรรมชาติเสริมไอโอดีน (สูตรเค็มน้อย)</td>
                  <td>3%</td>
                </tr>
                <tr>
                  <td>วัตถุกันเสีย / ฟอร์มาลีน / ผงชูรส</td>
                  <td style="color:#059669;">0% (ไม่เจือปน)</td>
                </tr>
              </table>

              <div class="info-list">
                • <b>ข้อมูลสำหรับผู้แพ้อาหาร:</b> มีปลา (Contains Fish)<br>
                • <b>มาตรฐานการผลิต:</b> ตากแดดในโรงอบโดมปิด (&gt;37°C) 1 วัน แช่แข็งเฉียบพลัน (≤-18°C) อย่างน้อย 12 ชม. และซีลสูญญากาศ PA/PE<br>
